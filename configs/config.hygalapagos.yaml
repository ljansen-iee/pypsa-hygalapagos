  # microgrid_4:     # Floreana
  #   lon_min: -90.530000
  #   lon_max: -90.330000
  #   lat_min: -1.380000
  #   lat_max: -1.200000
load:
  scaling_factor: 15000

buildings:
  n_clusters:
    microgrid_1: 2  # Santa Cruz
    microgrid_2: 1  # Isabela
    microgrid_3: 2  # San Cristóbal
    microgrid_4: 1   # Floreana

generation_sites:
  enabled: true
  min_sites: 2
  max_sites: 5
  min_spacing_km: 2
  min_eligible_area_km2: 0.5
  max_connection_km: 40
  line_route_factor: 1.25
  # Illustrative distribution-line investment, not a surveyed island cost.
  line_investment_eur_per_mva_km: 100000
  line_lifetime_years: 30

# Use the prebuilt Latin America cutout; the tutorial cutout only covers Nigeria.
renewable:
  onwind:
    cutout: cutout-2013-era5
    resource_quality_classes:
      method: weather  # suitability_score or weather
      top_fraction: 0.1
    suitability:
      path: data/eolico_weighted_suitabilty_24_04.tif
      threshold: 0.0
  solar:
    cutout: cutout-2013-era5
    resource_quality_classes:
      method: weather  # suitability_score or weather
      top_fraction: 0.1
    suitability:
      path: data/solar_weighted_suitability_24_04.tif
      threshold: 0.0
